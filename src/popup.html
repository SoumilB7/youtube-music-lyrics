<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lyricly settings</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 300px; padding: 16px;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #121212; color: #fff;
    }
    h1 { margin: 0 0 12px; font-size: 15px; font-weight: 650; }
    label.row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 0; border-top: 1px solid rgba(255,255,255,.08); cursor: pointer;
    }
    .text small { display: block; color: rgba(255,255,255,.55); font-size: 12px; margin-top: 2px; }
    input[type="checkbox"] {
      appearance: none; flex: none; width: 36px; height: 20px; margin: 0; border-radius: 10px;
      background: rgba(255,255,255,.2); position: relative; cursor: pointer; transition: background .15s;
    }
    input[type="checkbox"]::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
      border-radius: 50%; background: #fff; transition: transform .15s;
    }
    input[type="checkbox"]:checked { background: #ff3b5c; }
    input[type="checkbox"]:checked::after { transform: translateX(16px); }
    input[type="checkbox"]:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    p.hint { margin: 10px 0 0; color: rgba(255,255,255,.5); font-size: 12px; }
    a { color: #fff; }
    kbd { font: inherit; padding: 0 4px; border: 1px solid rgba(255,255,255,.25); border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Lyricly</h1>
  <label class="row">
    <span class="text">Open Lyrics tab automatically<small>Switch to the Lyrics tab when the player opens.</small></span>
    <input type="checkbox" id="autoOpenLyrics">
  </label>
  <label class="row">
    <span class="text">Show Lyricly lyrics<small>Off shows YouTube Music's own lyrics instead.</small></span>
    <input type="checkbox" id="visible">
  </label>
  <p class="hint"><kbd>Alt</kbd>+<kbd>L</kbd> also shows or hides the lyrics.</p>
  <p class="hint">Lyrics from <a href="https://lrclib.net" target="_blank" rel="noopener">LRCLIB</a>, a free, open-source lyrics database.</p>
  <script src="popup.js"></script>
</body>
</html>
